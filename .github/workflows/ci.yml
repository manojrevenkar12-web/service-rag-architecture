name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SRA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Ingest is idempotent
        run: sra ingest --seed 4242 && sra ingest --seed 4242 | grep "1102 in the store"

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Dev gates pass
        run: sra lab gate
      - name: Held-out was run once and is locked
        run: |
          test -f reports/heldout.lock
          set +e; sra lab heldout; code=$?; set -e
          test "$code" = 3
      - name: Generated files are up to date
        run: sra lab report && git diff --exit-code README.md REPORT.md web/public/data/study.json
      - name: The study reproduces
        run: sra lab dev --check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
