[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "service-rag-architecture"
version = "1.0.0"
description = "Enterprise GenAI reference architecture for industrial service: retrieval measured on manuals with known answers, and a LangGraph multi-agent service assistant on PGVector."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.5", "joblib>=1.4",
  "langgraph>=1.0", "langchain-core>=1.0",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "pgvector>=0.3", "httpx>=0.27", "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sra = "sra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 180
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
