services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sra
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
  api:
    build: .
    environment:
      SRA_DATABASE_URL: postgresql://postgres:postgres@db:5432/sra
      SRA_API_KEYS: ${SRA_API_KEYS:-demo:demo-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
